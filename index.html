<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sandro Game V2 - Deep Space</title>
<link rel="stylesheet" href="styles.css">

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#sky{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(ellipse at 15% 20%,rgba(100,20,190,.42),transparent 32%),
        radial-gradient(ellipse at 85% 25%,rgba(0,100,220,.35),transparent 30%),
        radial-gradient(ellipse at 70% 75%,rgba(220,20,150,.25),transparent 35%),
        radial-gradient(ellipse at 25% 85%,rgba(20,80,180,.28),transparent 32%),
        linear-gradient(135deg,#000006,#05001d 48%,#000 100%);
}

#sky::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(ellipse at 25% 35%,transparent 0 18%,rgba(120,40,220,.22) 35%,transparent 58%),
        radial-gradient(ellipse at 75% 55%,transparent 0 20%,rgba(0,160,255,.18) 38%,transparent 62%),
        radial-gradient(ellipse at 50% 90%,transparent 0 18%,rgba(255,20,150,.16) 35%,transparent 60%);
    filter:blur(28px);
    animation:nebulaMove 18s ease-in-out infinite alternate;
    pointer-events:none;
}

#sky::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.72));
    pointer-events:none;
}

@keyframes nebulaMove{
    from{transform:rotate(0) scale(1)}
    to{transform:rotate(5deg) scale(1.12)}
}

.space-stars{
    position:absolute;
    inset:-30%;
    z-index:2;
    pointer-events:none;
    background-image:
        radial-gradient(circle,#fff 0 1px,transparent 1.7px),
        radial-gradient(circle,#fff 0 1.5px,transparent 2px),
        radial-gradient(circle,#fff 0 2px,transparent 2.5px),
        radial-gradient(circle,#fff 0 1px,transparent 1.6px);
    background-size:83px 101px,137px 149px,191px 173px,251px 227px;
    background-position:12px 20px,48px 75px,90px 12px,170px 110px;
    animation:
        starsTravel 18s linear infinite,
        starsColor 7s linear infinite,
        starsBlink 2s ease-in-out infinite alternate;
}

.space-stars::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,#fff 0 2px,transparent 2.8px),
        radial-gradient(circle,#fff 0 1.5px,transparent 2px);
    background-size:223px 187px,311px 257px;
    animation:
        starsTravelReverse 25s linear infinite,
        starsColorReverse 9s linear infinite;
}

@keyframes starsTravel{
    from{transform:translate(0,0) rotate(0deg)}
    to{transform:translate(-130px,90px) rotate(5deg)}
}

@keyframes starsTravelReverse{
    from{transform:translate(0,0)}
    to{transform:translate(100px,-70px)}
}

@keyframes starsColor{
    0%{filter:hue-rotate(0deg) brightness:.8}
    25%{filter:hue-rotate(90deg) brightness(1.4)}
    50%{filter:hue-rotate(180deg) brightness(1)}
    75%{filter:hue-rotate(270deg) brightness(1.5)}
    100%{filter:hue-rotate(360deg) brightness(.8)}
}

@keyframes starsColorReverse{
    0%{filter:hue-rotate(360deg) brightness(1)}
    50%{filter:hue-rotate(180deg) brightness(1.6)}
    100%{filter:hue-rotate(0deg) brightness(1)}
}

@keyframes starsBlink{
    from{opacity:.45}
    to{opacity:1}
}

.space-planet{
    position:absolute;
    border-radius:50%;
    z-index:3;
    pointer-events:none;
}

.space-planet::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.75),transparent 17%);
}

#planet{
    top:115px;
    left:8%;
    width:145px;
    height:145px;
    background:
        radial-gradient(circle at 63% 65%,#722b9e 0 8%,transparent 9%),
        radial-gradient(circle at 30% 62%,#e15c87 0 7%,transparent 8%),
        radial-gradient(circle at 55% 28%,#ffbd62 0 6%,transparent 7%),
        linear-gradient(135deg,#ffaf68,#bb3b91 48%,#32156e);
    box-shadow:inset -25px -18px 30px #170d3c,0 0 30px #ff62c7,0 0 75px #8d35dd;
}

#planet::before{
    content:"";
    position:absolute;
    inset:48px -38px;
    border:9px solid rgba(255,210,151,.75);
    border-left-color:rgba(255,115,194,.35);
    border-radius:50%;
    transform:rotate(-18deg);
}

#planet2{
    top:18%;
    right:17%;
    width:105px;
    height:105px;
    background:linear-gradient(135deg,#86e9ff,#2761c5 55%,#121b70);
    box-shadow:inset -20px -15px 25px #07134e,0 0 25px #42cfff,0 0 60px #167bff;
}

#planet3{
    top:54%;
    left:18%;
    width:62px;
    height:62px;
    background:linear-gradient(135deg,#ff9270,#b63a45 60%,#521932);
    box-shadow:inset -12px -10px 16px #351326,0 0 18px #ff674d;
}

#planet4{
    right:3%;
    bottom:25%;
    width:185px;
    height:185px;
    background:linear-gradient(135deg,#63f0c0,#19638c 58%,#111c54);
    box-shadow:inset -30px -20px 35px #07153c,0 0 35px #32dbca,0 0 80px #168ca8;
}

#planet4::before{
    content:"";
    position:absolute;
    inset:68px -35px;
    border:7px solid rgba(153,225,255,.65);
    border-radius:50%;
    transform:rotate(15deg);
}

#p{
    position:absolute;
    bottom:105px;
    left:50%;
    width:70px;
    height:92px;
    z-index:30;
    font-size:0;
    transform:translateX(-50%);
    border:4px solid #b9d7e5;
    border-radius:28px 28px 18px 18px;
    background:linear-gradient(#f8ffff,#b9d3df 70%,#778d9b);
    box-shadow:
        13px 12px 0 -5px #a4c2cf,
        -13px 12px 0 -5px #a4c2cf,
        inset -10px -8px 12px rgba(0,0,0,.3),
        0 0 12px #8deaff;
    animation:none!important;
    transition:none!important;
}

#p::before{
    content:"";
    position:absolute;
    left:7px;
    top:-47px;
    width:48px;
    height:48px;
    border:6px solid #d8f4ff;
    border-radius:50%;
    background:
        linear-gradient(135deg,rgba(255,255,255,.8),transparent 35%),
        linear-gradient(160deg,#153b68 0 45%,#67dfff 46% 58%,#102746 59%);
    box-shadow:inset -7px -7px 10px rgba(0,0,0,.45),0 0 12px #8deaff;
}

#p::after{
    content:"";
    position:absolute;
    left:17px;
    top:24px;
    width:36px;
    height:27px;
    border:3px solid #496877;
    border-radius:6px;
    background:
        radial-gradient(circle at 8px 8px,#ff3636 0 3px,transparent 4px),
        radial-gradient(circle at 18px 8px,#ffe43b 0 3px,transparent 4px),
        radial-gradient(circle at 28px 8px,#42ff7b 0 3px,transparent 4px),
        linear-gradient(#34586b,#182f43);
}

.a{
    position:absolute;
    width:58px;
    height:58px;
    z-index:30;
    font-size:0!important;
    color:transparent;
    border-radius:47% 53% 58% 42%;
    background:
        radial-gradient(circle at 27% 25%,#a99a89 0 7%,transparent 8%),
        radial-gradient(circle at 68% 32%,#5c5049 0 10%,transparent 11%),
        radial-gradient(circle at 44% 70%,#77675b 0 13%,transparent 14%),
        radial-gradient(circle at 75% 72%,#3e3734 0 7%,transparent 8%),
        linear-gradient(135deg,#b5a18b,#65564d 48%,#292524);
    border:3px solid #3c302a;
    box-shadow:
        inset -10px -9px 12px rgba(0,0,0,.6),
        inset 6px 5px 8px rgba(255,220,170,.3),
        0 0 8px #ff6a00,
        0 0 20px rgba(255,45,0,.75);
}

/* Api tetap di atas batu, tetapi arah apinya dibalik */
.a::before{
    content:"";
    position:absolute;
    z-index:-1;
    left:7px;
    top:-82px;
    width:44px;
    height:88px;
    border-radius:70% 70% 45% 45%;
    background:
        radial-gradient(
            ellipse at 50% 100%,
            #fff 0 8%,
            #fff000 20%,
            #ff8a00 45%,
            #ff2600 70%,
            transparent 75%
        );
    filter:blur(3px);
    transform:rotate(0deg);
    transform-origin:bottom center;
    animation:meteorFireReverse .12s ease-in-out infinite alternate;
}

.a::after{
    content:"";
    position:absolute;
    z-index:-2;
    left:14px;
    top:-76px;
    width:30px;
    height:92px;
    border-radius:50%;
    background:rgba(255,35,0,.5);
    filter:blur(13px);
    transform:rotate(0deg);
}

@keyframes meteorFireReverse{
    from{
        height:58px;
        opacity:.7;
        transform:rotate(-8deg) scaleX(.8);
    }

    to{
        height:92px;
        opacity:1;
        transform:rotate(8deg) scaleX(1.15);
    }
}

#moon,
#mountains,
#ground{
    display:none;
}

@media(max-width:600px){
    #planet{top:125px;left:3%;width:82px;height:82px}
    #planet2{top:18%;right:8%;width:65px;height:65px}
    #planet3{top:48%;left:10%;width:42px;height:42px}
    #planet4{right:-28px;bottom:27%;width:110px;height:110px}

    #p{
        bottom:105px;
        transform:translateX(-50%) scale(.8);
        transform-origin:bottom center;
    }

    .a{
        width:48px;
        height:48px;
    }

    .a::before{
        top:-68px;
        height:76px;
    }

    .a::after{
        top:-64px;
        height:80px;
    }
}
</style>
</head>

<body>
<div id="sky">
    <div class="space-stars"></div>
    <div id="planet" class="space-planet"></div>
    <div id="planet2" class="space-planet"></div>
    <div id="planet3" class="space-planet"></div>
    <div id="planet4" class="space-planet"></div>
</div>

<div id="gameTitle">SANDRO GAME V2</div>
<div id="score">Score : 0</div>
<div id="levelUp">LEVEL UP!</div>
<div id="p"></div>

<div id="menu">
    <h1>SANDRO GAME V2</h1>
    <p>Pilih level awal 1 - 30</p>

    <select id="levelSelect">
        <script>
            for(let i = 1; i <= 30; i++){
                document.write(`<option value="${i}">Level ${i}</option>`);
            }
        </script>
    </select>

    <button id="start">▶ START</button>
</div>

<div id="over">
    <h1>GAME OVER</h1>
    <p>Game selesai. Pilih aksi di bawah.</p>
    <button id="restart">🔄 MULAI ULANG</button>
    <button id="pickLevel">📌 PILIH LEVEL</button>
</div>

<button id="l">◀</button>
<button id="r">▶</button>
<button id="fs">⛶</button>

<script src="script.js"></script>
</body>
</html>
